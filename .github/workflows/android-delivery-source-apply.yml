name: Android delivery source application
on:
  push:
    branches: [fix/reliable-delivery-20260905]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply authored source edits
        run: |
          python .maintenance/apply-android-delivery.py
          sha256sum -c <<'HASHES'
          5f9e07a38cce0238b31cc361ac9befa0daabc0f9002310d5d520182cf7308634  android/app/src/main/java/com/onedayonemasterpiece/recordideahub/ApiClient.kt
          2f40649e71e0199a1f6ba32edfd2b993977ca8e932f8a4ee8d3168f386600081  android/app/src/main/java/com/onedayonemasterpiece/recordideahub/SessionStore.kt
          9ef042c5adaa00a7c1f320053466148c49787380f97e9555c96e62515b48f379  android/app/src/main/java/com/onedayonemasterpiece/recordideahub/SyncEngine.kt
          HASHES
          git rm -r .maintenance
          git diff --check
          git config user.name 'OpenAI ChatGPT'
          git config user.email 'noreply@openai.com'
          git add android
          git commit -m 'fix(android): durable per-session delivery with UIDT and safe queue migration'
          git push origin HEAD:fix/reliable-delivery-20260905
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Lint, tests and APK
        run: gradle -p android --no-daemon --stacktrace lintDebug testDebugUnitTest assembleDebug
      - name: Export exact source and reports
        if: always()
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/source.tar
          git rev-parse HEAD > evidence/SOURCE_SHA.txt
          if [ -d android/app/build/reports ]; then cp -r android/app/build/reports evidence/; fi
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk evidence/record-idea-hub-1.1.0-rc4-debug.apk
            (cd evidence && sha256sum record-idea-hub-1.1.0-rc4-debug.apk > SHA256SUMS.txt)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-delivery-source-evidence
          path: evidence/
          retention-days: 3
