name: Reliability source snapshot
on:
  push:
    branches: [fix/reliable-delivery-20260905]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 35fb24ee20ef2845824032793dedb60aee7ea6fa
          path: record-idea-hub
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: onedayonemasterpiece/my-data-hub
          ref: b816f9a5c6f3d166c17b5c2c31110896e40241e2
          path: my-data-hub
          persist-credentials: false
      - name: Archive only tracked source
        run: |
          mkdir source
          git -C record-idea-hub archive --format=tar HEAD > source/record-idea-hub.tar
          git -C my-data-hub archive --format=tar HEAD > source/my-data-hub.tar
          printf '%s\n' 'record-idea-hub 35fb24ee20ef2845824032793dedb60aee7ea6fa' 'my-data-hub b816f9a5c6f3d166c17b5c2c31110896e40241e2' > source/PINS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reliability-pinned-source
          path: source/
          retention-days: 2
          if-no-files-found: error
