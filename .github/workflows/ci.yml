name: Android CI and APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-idea-hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android:
    name: Android checks and unsigned APK evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Lint, test and assemble
        run: >-
          gradle -p android --no-daemon --stacktrace
          -PunsignedEvidence=true lintDebug testDebugUnitTest assembleDebug
      - name: Prepare unsigned APK evidence (NOT an update)
        shell: bash
        run: |
          mkdir -p artifacts
          mapfile -t APKS < <(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk')
          test "${#APKS[@]}" -eq 1
          cp "${APKS[0]}" artifacts/record-idea-hub-readback-unsigned.apk
          (cd artifacts && sha256sum record-idea-hub-readback-unsigned.apk > SHA256SUMS.txt)
          git rev-parse HEAD > artifacts/SOURCE_SHA.txt
          printf '%s\n' 'UNSIGNED — DO NOT INSTALL. RC4 matching private key has not been established.' > artifacts/SIGNING-CERTIFICATE.txt
          printf '%s\n' 'Expected installed RC4 certificate SHA256: d76232a3b9b298bb31f244dcd47a8f8d8cf2f8c02501cd8a46f2f6aea0694a95' >> artifacts/SIGNING-CERTIFICATE.txt
          test ! -f "$HOME/.android/debug.keystore"
      - name: Upload unsigned readback APK evidence
        uses: actions/upload-artifact@v7
        with:
          name: record-idea-hub-readback-unsigned-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare verification evidence
        if: always()
        run: |
          mkdir -p verification
          git rev-parse HEAD > verification/SOURCE_SHA.txt
          git archive --format=tar HEAD > verification/source.tar
          if [ -d android/app/build/reports ]; then cp -r android/app/build/reports verification/; fi
          if [ -d android/app/build/test-results ]; then cp -r android/app/build/test-results verification/; fi
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: record-idea-hub-verification
          path: verification/
          if-no-files-found: error
          retention-days: 14
