name: Android CI and APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-idea-hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  android:
    name: Android checks and installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-disabled: true
      - name: Lint, test and assemble
        run: >-
          gradle -p android --no-daemon --stacktrace
          lintDebug testDebugUnitTest assembleDebug
      - name: Prepare versioned APK artifact
        shell: bash
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/record-idea-hub-1.1.0-rc3-debug.apk
          (cd artifacts && sha256sum record-idea-hub-1.1.0-rc3-debug.apk > SHA256SUMS.txt)
      - name: Upload installable Android 1.1 RC3 APK
        uses: actions/upload-artifact@v7
        with:
          name: record-idea-hub-1.1-rc3-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
